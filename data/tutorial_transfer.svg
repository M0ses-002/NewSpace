  <text x="95" y="318" fill="#7fa8bb" font-family="sans-serif" font-size="12" text-anchor="middle">A 引力区 400 km</text>
  <ellipse cx="120" cy="235" rx="105" ry="42" fill="none" stroke="#f4b656" stroke-width="2"/>
